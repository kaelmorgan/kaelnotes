<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Analysis Intelligence Index, August 2026</title>
  <desc id="desc">Claude Opus 5 63, Claude Fable 5 62, Grok 4.6 61, GPT-5.6 Sol 61</desc>
  <rect width="800" height="420" fill="#f7f4ee"/>
  <text x="40" y="42" fill="#1c1917" font-family="Georgia, serif" font-size="20">Artificial Analysis Intelligence Index</text>
  <text x="40" y="68" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Higher is better. Snapshot of each lab's published top setting, August 2026.</text>

  <!-- axis -->
  <line x1="250" y1="100" x2="250" y2="360" stroke="#e7e1d6" stroke-width="1"/>
  <line x1="250" y1="360" x2="760" y2="360" stroke="#e7e1d6" stroke-width="1"/>

  <!-- scale ticks 50-65 -->
  <g fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <text x="250" y="378" text-anchor="middle">50</text>
    <text x="420" y="378" text-anchor="middle">55</text>
    <text x="590" y="378" text-anchor="middle">60</text>
    <text x="760" y="378" text-anchor="middle">65</text>
  </g>
  <g stroke="#e7e1d6" stroke-dasharray="3 5">
    <line x1="420" y1="100" x2="420" y2="360"/>
    <line x1="590" y1="100" x2="590" y2="360"/>
    <line x1="760" y1="100" x2="760" y2="360"/>
  </g>

  <!-- bars: 50->65 maps 250->760, width per point = 34 -->
  <!-- Opus 63: (63-50)*34 = 442 -->
  <rect x="250" y="112" width="442" height="38" fill="#31475a"/>
  <text x="40" y="137" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Claude Opus 5 (max)</text>
  <text x="702" y="137" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">63</text>

  <!-- Fable 62: 12*34=408 -->
  <rect x="250" y="168" width="408" height="38" fill="#4d6478"/>
  <text x="40" y="193" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Claude Fable 5 (max)*</text>
  <text x="668" y="193" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">62</text>

  <!-- Grok 61: 11*34=374 -->
  <rect x="250" y="224" width="374" height="38" fill="#7a8a6a"/>
  <text x="40" y="249" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Grok 4.6 (high)</text>
  <text x="634" y="249" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">61</text>

  <!-- Sol 61 -->
  <rect x="250" y="280" width="374" height="38" fill="#8c7a66"/>
  <text x="40" y="305" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">GPT-5.6 Sol (max)</text>
  <text x="634" y="305" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">61</text>

  <text x="40" y="408" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">*Fable 5 measured with max effort and a fallback configuration on Artificial Analysis.</text>
</svg>
