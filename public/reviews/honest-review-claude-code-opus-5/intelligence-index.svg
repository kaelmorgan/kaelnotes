<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Analysis Intelligence Index, early September 2026</title>
  <desc id="desc">Fable 5.1 66, Opus 5 63, Fable 5 62, GPT-5.6 Sol 61, GPT-6 Astra 61, Grok 4.6 61</desc>
  <rect width="800" height="520" fill="#f7f4ee"/>
  <text x="40" y="42" fill="#1c1917" font-family="Georgia, serif" font-size="20">Artificial Analysis Intelligence Index</text>
  <text x="40" y="68" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Higher is better. Snapshot of each lab's published top setting, early September 2026.</text>

  <line x1="250" y1="96" x2="250" y2="450" stroke="#e7e1d6" stroke-width="1"/>
  <line x1="250" y1="450" x2="760" y2="450" stroke="#e7e1d6" stroke-width="1"/>

  <g fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <text x="250" y="468" text-anchor="middle">55</text>
    <text x="420" y="468" text-anchor="middle">59</text>
    <text x="590" y="468" text-anchor="middle">63</text>
    <text x="760" y="468" text-anchor="middle">67</text>
  </g>
  <g stroke="#e7e1d6" stroke-dasharray="3 5">
    <line x1="420" y1="96" x2="420" y2="450"/>
    <line x1="590" y1="96" x2="590" y2="450"/>
    <line x1="760" y1="96" x2="760" y2="450"/>
  </g>

  <rect x="250" y="108" width="467.5" height="36" fill="#1f3344"/>
  <text x="36" y="132" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Fable 5.1 (max)*</text>
  <text x="728" y="132" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">66</text>

  <rect x="250" y="160" width="340" height="36" fill="#31475a"/>
  <text x="36" y="184" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Opus 5 (max)</text>
  <text x="600" y="184" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">63</text>

  <rect x="250" y="212" width="297.5" height="36" fill="#4d6478"/>
  <text x="36" y="236" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Fable 5 (max)*</text>
  <text x="558" y="236" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">62</text>

  <rect x="250" y="264" width="255" height="36" fill="#8c7a66"/>
  <text x="36" y="288" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">GPT-5.6 Sol (max)</text>
  <text x="515" y="288" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">61</text>

  <rect x="250" y="316" width="255" height="36" fill="#6b5c4c"/>
  <text x="36" y="340" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">GPT-6 Astra (max)</text>
  <text x="515" y="340" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">61</text>

  <rect x="250" y="368" width="255" height="36" fill="#7a8a6a"/>
  <text x="36" y="392" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Grok 4.6 (high)</text>
  <text x="515" y="392" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">61</text>

  <text x="40" y="502" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">*Fable 5 and Fable 5.1 measured with max effort and a fallback configuration on Artificial Analysis.</text>
</svg>
