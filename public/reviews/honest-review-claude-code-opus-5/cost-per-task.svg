<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Analysis cost per Intelligence Index task</title>
  <desc id="desc">Grok 4.6 $0.84, Opus 5 $2.34, Fable 5 $3.14, Fable 5.1 $3.76</desc>
  <rect width="800" height="400" fill="#f7f4ee"/>
  <text x="40" y="42" fill="#1c1917" font-family="Georgia, serif" font-size="20">Cost per Intelligence Index task</text>
  <text x="40" y="68" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">USD, Artificial Analysis. Same suite, different token habits - this is the real bill.</text>

  <line x1="40" y1="310" x2="760" y2="310" stroke="#e7e1d6"/>

  <rect x="90" y="265.3" width="120" height="44.7" fill="#7a8a6a"/>
  <text x="150" y="330" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Grok 4.6</text>
  <text x="150" y="256" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$0.84</text>

  <rect x="256" y="185.5" width="120" height="124.5" fill="#31475a"/>
  <text x="316" y="330" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Opus 5 max</text>
  <text x="316" y="176" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$2.34</text>

  <rect x="422" y="143" width="120" height="167" fill="#4d6478"/>
  <text x="482" y="330" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Fable 5 max</text>
  <text x="482" y="134" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$3.14</text>

  <rect x="588" y="110" width="120" height="200" fill="#1f3344"/>
  <text x="648" y="330" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Fable 5.1 max</text>
  <text x="648" y="101" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$3.76</text>

  <text x="40" y="372" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Opus 5 is about 1.6x cheaper per task than Fable 5.1, and half the list token price of Fable. Grok still sits in another cost class.</text>
</svg>
