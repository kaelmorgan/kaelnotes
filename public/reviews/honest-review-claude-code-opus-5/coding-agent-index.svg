<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Analysis Coding Agent Index</title>
  <desc id="desc">Fable 5.1 in Claude Code 70, Opus 5 and Fable 5 in Claude Code about 67, GPT-6 Astra in Codex 67</desc>
  <rect width="800" height="400" fill="#f7f4ee"/>
  <text x="40" y="42" fill="#1c1917" font-family="Georgia, serif" font-size="20">Coding Agent Index</text>
  <text x="40" y="68" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Native harnesses. Fable 5.1 leads; Opus 5 sits with Fable 5 and GPT-6 Astra around 67.</text>

  <line x1="280" y1="96" x2="280" y2="320" stroke="#e7e1d6"/>
  <line x1="280" y1="320" x2="760" y2="320" stroke="#e7e1d6"/>

  <g fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <text x="280" y="338" text-anchor="middle">60</text>
    <text x="440" y="338" text-anchor="middle">64</text>
    <text x="600" y="338" text-anchor="middle">68</text>
    <text x="760" y="338" text-anchor="middle">72</text>
  </g>
  <g stroke="#e7e1d6" stroke-dasharray="3 5">
    <line x1="440" y1="96" x2="440" y2="320"/>
    <line x1="600" y1="96" x2="600" y2="320"/>
    <line x1="760" y1="96" x2="760" y2="320"/>
  </g>

  <rect x="280" y="112" width="400" height="36" fill="#1f3344"/>
  <text x="36" y="136" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Fable 5.1 / Claude Code</text>
  <text x="690" y="136" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">70</text>

  <rect x="280" y="164" width="280" height="36" fill="#31475a"/>
  <text x="36" y="188" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Opus 5 / Claude Code</text>
  <text x="570" y="188" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">~67</text>

  <rect x="280" y="216" width="280" height="36" fill="#4d6478"/>
  <text x="36" y="240" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Fable 5 / Claude Code</text>
  <text x="570" y="240" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">~67</text>

  <rect x="280" y="268" width="280" height="36" fill="#6b5c4c"/>
  <text x="36" y="292" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">GPT-6 Astra / Codex</text>
  <text x="570" y="292" fill="#fffcf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">67</text>

  <text x="40" y="378" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">From Artificial Analysis, September 2026. Opus 5 and Fable 5 described as approximately equal to Astra's 67.</text>
</svg>
