<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">List API price per million output tokens</title>
  <desc id="desc">Grok 4.6 $6, Opus 5 $25, GPT-5.6 Sol $30, Fable 5 and 5.1 $50, GPT-6 Astra $50</desc>
  <rect width="800" height="420" fill="#f7f4ee"/>
  <text x="40" y="42" fill="#1c1917" font-family="Georgia, serif" font-size="20">List API price, output tokens</text>
  <text x="40" y="68" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">USD per 1 million output tokens. Thinking models burn most of the bill here.</text>

  <line x1="40" y1="330" x2="760" y2="330" stroke="#e7e1d6"/>

  <rect x="62" y="304.8" width="100" height="25.2" fill="#7a8a6a"/>
  <text x="112" y="350" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Grok 4.6</text>
  <text x="112" y="296" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$6</text>

  <rect x="198" y="225" width="100" height="105" fill="#31475a"/>
  <text x="248" y="350" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Opus 5</text>
  <text x="248" y="216" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$25</text>

  <rect x="334" y="204" width="100" height="126" fill="#8c7a66"/>
  <text x="384" y="350" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">GPT-5.6 Sol</text>
  <text x="384" y="195" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$30</text>

  <rect x="470" y="120" width="100" height="210" fill="#4d6478"/>
  <text x="520" y="350" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Fable 5 / 5.1</text>
  <text x="520" y="111" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$50</text>

  <rect x="606" y="120" width="100" height="210" fill="#6b5c4c"/>
  <text x="656" y="350" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">GPT-6 Astra</text>
  <text x="656" y="111" text-anchor="middle" fill="#1c1917" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">$50</text>

  <text x="40" y="392" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Input list: Grok $2, Opus $5, Sol about $5, Fable and Astra $10. Opus Fast mode is $10 / $50 - Fable price, for speed.</text>
</svg>
